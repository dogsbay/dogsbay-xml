picocliVersion=4.7.6
jlineVersion=3.26.3
jacksonVersion=2.19.0
junitVersion=5.11.3
junitPlatformVersion=1.11.3
slf4jVersion=2.0.17
commonmarkVersion=0.24.0
jingVersion=20241231
trangVersion=20241231
phSchematronVersion=10.0.2
saxonVersion=12.7
assertjVersion=3.26.3
