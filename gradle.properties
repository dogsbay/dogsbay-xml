# Gradle daemon JVM. The native-access flag stops JDK 25 warning about
# Gradle's own native-platform library on every invocation.
org.gradle.jvmargs=-Xmx2g --enable-native-access=ALL-UNNAMED

# ── Dependency versions ──────────────────────────────────────────────────────
