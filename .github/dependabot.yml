version: 2
updates:
  # Gradle-declared dependencies (Maven coordinates in build.gradle.kts).
  # NOTE: the vendored jars under lib/ are NOT tracked by Dependabot — they are
  # flat-file dependencies. Keep those updated manually (see
  # the vendored-dependency inventory).
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # xmlresolver 6 removed ResolverFeature.CACHE_DIRECTORY, which the committed
      # DITA-OT engine (lib/dost.jar) reads: 6.x compiles and then aborts every publish.
      # Raising it is a DITA-OT upgrade, not a dependency bump — see ResolverUpgradeTest.
      - dependency-name: "org.xmlresolver:xmlresolver"
        update-types: ["version-update:semver-major"]

  # GitHub Actions used by the CI workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
